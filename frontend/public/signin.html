<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - MyApp</title>
    <!-- Collegamento ai file CSS per lo stile, la navbar e il footer -->
    <link rel="stylesheet" href="/api/v1/css/navbar.css">
    <link rel="stylesheet" href="/api/v1/css/footer.css">
    <link rel="stylesheet" href="/api/v1/css/signin.css">
</head>
<body>
    <div id="navbar"></div>
    <script>
        fetch("/api/v1/components/navbar.html")
            .then(res => res.text())
            .then(html => document.getElementById("navbar").innerHTML = html)
    </script>

    <!-- SIGNIN CONTENT -->
    <div class="signin-wrapper">
        <section class="signin-box">
            <h2>Crea un account</h2>
            <form action="/api/v1/signin" method="POST" id="signin-form">
                <div class="form-group">
                    <label for="username">Nome Utente:</label><br>
                    <input type="text" id="username" name="username" required>
                </div>
                <br>
                <div class="form-group">
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </div>
                <br>
                <div class="form-group">
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" required>
                </div>
                <br>
                <button type="submit" class="button">Registrati</button>
            </form>
            <br>
            <p>Hai già un account? <a href="/api/v1/login">Accedi qui</a></p>
        </section>
    </div>

    <!-- FOOTER -->
    <div id="footer"></div>
    <script>
        fetch("/api/v1/components/footer.html")
            .then(res => res.text())
            .then(html => document.getElementById("footer").innerHTML = html)
    </script>
    <script src="/api/v1/js/signin.js"></script>
</body>
</html>
