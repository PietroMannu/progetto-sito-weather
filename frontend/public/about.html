<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Siamo - MyApp</title>
    <!-- Collegamento ai file CSS per lo stile, la navbar e il footer -->
    <link rel="stylesheet" href="/api/v1/css/navbar.css">
    <link rel="stylesheet" href="/api/v1/css/footer.css">
    <link rel="stylesheet" href="/api/v1/css/about.css">
</head>
<body>
    <div id="navbar"></div>
    <script>
        fetch("/api/v1/components/navbar.html")
            .then(res => res.text())
            .then(html => document.getElementById("navbar").innerHTML = html)
    </script>

    <!-- ABOUT CONTENT -->
    <main class="about-wrapper">
        <section class="hero">
            <h1>Chi siamo?</h1>
            <p>Questa è la pagina "Chi siamo" del progetto.</p>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>
    <script>
        fetch("/api/v1/components/footer.html")
            .then(res => res.text())
            .then(html => document.getElementById("footer").innerHTML = html)
    </script>
</body>
</html>
