<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyApp</title>
    <link rel="stylesheet" href="/api/v1/css/navbar.css">
    <link rel="stylesheet" href="/api/v1/css/footer.css">
    <link rel="stylesheet" href="/api/v1/css/login.css">
</head>
<body>
    <div class="page-shell">
        <div id="navbar"></div>

        <main class="login-page">
            <div class="login-box">
                <h2>Login</h2>
                <form action="/login" method="POST" id="login-form">
                    <input type="text" name="username" placeholder="Username" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit" class="button">Accedi</button>
                </form>
            </div>
        </main>

        <div id="footer"></div>
    </div>

    <script>
        fetch("/api/v1/components/navbar.html")
            .then(res => res.text())
            .then(html => document.getElementById("navbar").innerHTML = html);

        fetch("/api/v1/components/footer.html")
            .then(res => res.text())
            .then(html => document.getElementById("footer").innerHTML = html);
    </script>
    <script src="/api/v1/js/login.js"></script>
</body>
</html>
